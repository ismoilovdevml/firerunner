# promtool test rules deploy/prometheus/firerunner-alerts_test.yml
rule_files:
- firerunner-alerts.yml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: firerunner_jobs_total{instance="h1",job="firerunner",result="success",reason="none"}
    values: 0+1x40
  - series: firerunner_jobs_total{instance="h1",job="firerunner",result="system_failure",reason="vm_boot"}
    values: 0x20 1 2 3 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4 4
  - series: firerunner_jobs_total{instance="h2",job="firerunner",result="script_failure",reason="none"}
    values: 0+1x40
  - series: firerunner_jobs_total{instance="h2",job="firerunner",result="system_failure",reason="canceled"}
    values: 0+1x40
  - series: firerunner_dhcp_leases{instance="h1",job="firerunner",state="live"}
    values: 20x40
  - series: firerunner_dhcp_leases{instance="h1",job="firerunner",state="stale"}
    values: 180x40
  - series: firerunner_dhcp_leases_capacity{instance="h1",job="firerunner"}
    values: 241x40
  - series: up{instance="h1",job="firerunner"}
    values: 1x40
  - series: firerunner_loop_last_tick_timestamp_seconds{instance="h1",job="firerunner"}
    values: 0+60x10 600x30
  - series: firerunner_host_oom_kills_total{instance="h1",job="firerunner"}
    values: 0x20 1x20
  alert_rule_test:
  - eval_time: 30m
    alertname: FireRunnerSystemFailures
    exp_alerts:
    - exp_labels:
        severity: critical
        instance: h1
      exp_annotations:
        summary: Jobs on h1 fail because of FireRunner or the host
        description: 'Not project bugs. See the reason: sum by (reason) (increase(firerunner_jobs_total{result="system_failure"}[30m])). ssh_lost: host OOM or a VM died; vm_boot: DHCP or boot; flintlock_error:
          flintlockd or the thin pool; admission_timeout: memory. Per job: journalctl -u firerunner | grep ''"result":"system_failure"''.'
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnersystemfailures
  - eval_time: 30m
    alertname: FireRunnerDHCPLeasesExhausting
    exp_alerts:
    - exp_labels:
        severity: critical
        instance: h1
      exp_annotations:
        summary: 82.99% of the microVM DHCP addresses are in use on h1
        description: 'At 100% jobs fail with ''got no DHCP lease''. If state="stale" dominates, leases of deleted VMs are not released: check that dhcp_release (dnsmasq-utils) is installed and journalctl
          -u firerunner | grep ''delete failed''.'
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerdhcpleasesexhausting
  - eval_time: 30m
    alertname: FireRunnerDaemonUnhealthy
    exp_alerts:
    - exp_labels:
        severity: critical
        instance: h1
        job: firerunner
      exp_annotations:
        summary: FireRunner daemon on h1 is down or stuck
        description: 'Jobs still run, but every one cold-boots, nothing reconciles and the other FireRunner alerts are blind. Check: journalctl -u firerunner -n 200. Before restarting it, check what
          its loop may wait on, which a restart does not fix: systemctl status flintlockd; sudo timeout 10 lvs flintlock/thinpool. Then: systemctl restart firerunner.'
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerdaemonunhealthy
  - eval_time: 5m
    alertname: FireRunnerDaemonUnhealthy
    exp_alerts: []
  - eval_time: 25m
    alertname: FireRunnerHostOOMKill
    exp_alerts:
    - exp_labels:
        severity: warning
        instance: h1
        job: firerunner
      exp_annotations:
        summary: The kernel OOM-killed a process on h1
        description: 'Usually a firecracker microVM: its job failed with ssh_lost or its builder died (FireRunnerSystemFailures pages when many jobs fail). See what was killed: journalctl -k --since
          -15min | grep -iE ''out of memory|killed process''. Admission keeps microVM memory below MemTotal minus vm.host_reserve_mb, so the host needed more than that reserve: raise it (firerunner
          config set vm.host_reserve_mb <MB>), or lower concurrent, pool.size or builder.max.'
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerhostoomkill
  - eval_time: 40m
    alertname: FireRunnerHostOOMKill
    exp_alerts: []
- interval: 1m
  input_series:
  - series: firerunner_flintlock_up{instance="h3",job="firerunner"}
    values: 1x5 0x20
  - series: firerunner_service_up{instance="h3",job="firerunner",service="flintlockd"}
    values: 1x5 0x20
  - series: firerunner_service_up{instance="h3",job="firerunner",service="firerunner-cache"}
    values: 1x5 0x20
  - series: firerunner_service_up{instance="h3",job="firerunner",service="firerunner-proxy"}
    values: 1x5 0x20
  - series: firerunner_service_up{instance="h3",job="firerunner",service="firerunner-net"}
    values: 1x25
  # One mirror's front crash-loops; its registry, the other mirror and
  # firerunner-registry (which only starts them) stay up.
  - series: firerunner_service_up{instance="h3",job="firerunner",service="firerunner-registry-front@ghcr.io"}
    values: 1x5 0x20
  - series: firerunner_service_up{instance="h3",job="firerunner",service="firerunner-registry@ghcr.io"}
    values: 1x25
  - series: firerunner_service_up{instance="h3",job="firerunner",service="firerunner-registry@docker.io"}
    values: 1x25
  - series: firerunner_service_up{instance="h3",job="firerunner",service="firerunner-registry"}
    values: 1x25
  - series: firerunner_thinpool_usage_ratio{instance="h3",job="firerunner",type="data"}
    values: 0.5x25
  - series: firerunner_thinpool_usage_ratio{instance="h3",job="firerunner",type="metadata"}
    values: 0.8x25
  alert_rule_test:
  - eval_time: 4m
    alertname: FireRunnerFlintlockDown
    exp_alerts: []
  - eval_time: 12m
    alertname: FireRunnerFlintlockDown
    exp_alerts:
    - exp_labels:
        severity: critical
        instance: h3
        job: firerunner
      exp_annotations:
        summary: 'flintlock API unreachable on h3: no microVM can be created'
        description: 'Every new job fails in prepare. Check: systemctl status flintlockd containerd-flintlock; journalctl -u flintlockd -n 100; firerunner doctor.'
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerflintlockdown
  - eval_time: 12m
    alertname: FireRunnerServiceDown
    exp_alerts:
    - exp_labels:
        severity: critical
        instance: h3
        job: firerunner
        service: flintlockd
      exp_annotations:
        summary: flintlockd is down on h3
        description: 'Jobs fail or are not picked up. Check: journalctl -u flintlockd -n 100; firerunner doctor.'
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerservicedown
  - eval_time: 12m
    alertname: FireRunnerCacheServiceDown
    exp_alerts: []
  - eval_time: 20m
    alertname: FireRunnerCacheServiceDown
    exp_alerts:
    - exp_labels:
        severity: warning
        instance: h3
        job: firerunner
        service: firerunner-cache
      exp_annotations:
        summary: firerunner-cache is down on h3
        description: 'Jobs run but slower: they start without their cache:. Check: journalctl -u firerunner-cache -n 100; df -h /var/lib/firerunner/cache.'
        runbook_url: &cache_down_runbook https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnercacheservicedown
    - exp_labels:
        severity: warning
        instance: h3
        job: firerunner
        service: firerunner-registry-front@ghcr.io
      exp_annotations:
        summary: firerunner-registry-front@ghcr.io is down on h3
        description: 'Jobs run but slower: image pulls bypass the mirror, to the registry itself (Docker Hub rate limits). Check: journalctl -u firerunner-registry-front@ghcr.io -n 100; systemctl list-units ''firerunner-registry*'';
          df -h /var/lib/firerunner/registries; systemctl status var-lib-firerunner-registries.mount.'
        runbook_url: *cache_down_runbook
  # The forwarder is down from 6m: quiet before its 3 minutes, critical after.
  - eval_time: 8m
    alertname: FireRunnerProxyDown
    exp_alerts: []
  - eval_time: 12m
    alertname: FireRunnerProxyDown
    exp_alerts:
    - exp_labels:
        severity: critical
        instance: h3
        job: firerunner
        service: firerunner-proxy
      exp_annotations:
        summary: 'firerunner-proxy is down on h3: nothing reaches the corporate proxy'
        description: 'microVMs, builders, gitlab-runner, containerd-flintlock and the registry mirrors reach the outside through it: jobs fail on pulls, clones and downloads (hosts in proxy.no_proxy still work). Check: journalctl -u firerunner-proxy -n 100; firerunner doctor (a 407 means the upstream refused the credentials). Fix: systemctl start firerunner-proxy.'
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerproxydown
  # Data at 50 % stays quiet; metadata at 80 % is over its 75 %.
  - eval_time: 20m
    alertname: FireRunnerThinPoolFull
    exp_alerts:
    - exp_labels:
        severity: warning
        instance: h3
        job: firerunner
        type: metadata
      exp_annotations:
        summary: Thin pool metadata 80% full on h3
        description: &thinpool_full_description 'At 100% every microVM create fails; full metadata can damage the pool. Check: sudo lvs flintlock; firerunner vm list. firerunner builder rm --all frees the builder
          VMs'' disks but also deletes every project''s saved layer cache, so every next build is cold. Lasting fix: vgextend flintlock <disk>, then lvextend flintlock/thinpool.'
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerthinpoolfull
# Waits for memory. a: 20 prepares/min, 3 of them waited over 30 s (15 %) -> fires after 10 min.
# b: 1 of 20 waited over 30 s (5 %) -> quiet. c: 2 jobs in total, both waited -> quiet (fewer than 3).
- interval: 1m
  input_series:
  - series: firerunner_job_admission_wait_seconds_count{instance="a",job="firerunner"}
    values: 0+4x60
  - series: firerunner_job_admission_wait_seconds_bucket{instance="a",job="firerunner",le="30"}
    values: 0+1x60
  - series: firerunner_job_prepare_seconds_count{instance="a",job="firerunner",source="pool"}
    values: 0+17x60
  - series: firerunner_job_prepare_seconds_count{instance="a",job="firerunner",source="cold"}
    values: 0+3x60
  - series: firerunner_job_admission_wait_seconds_count{instance="b",job="firerunner"}
    values: 0+2x60
  - series: firerunner_job_admission_wait_seconds_bucket{instance="b",job="firerunner",le="30"}
    values: 0+1x60
  - series: firerunner_job_prepare_seconds_count{instance="b",job="firerunner",source="pool"}
    values: 0+20x60
  - series: firerunner_job_admission_wait_seconds_count{instance="c",job="firerunner"}
    values: 0x20 1 2x39
  - series: firerunner_job_admission_wait_seconds_bucket{instance="c",job="firerunner",le="30"}
    values: 0x60
  - series: firerunner_job_prepare_seconds_count{instance="c",job="firerunner",source="cold"}
    values: 0x20 1 2x39
  alert_rule_test:
  - eval_time: 5m
    alertname: FireRunnerJobsWaitForMemory
    exp_alerts: []
  - eval_time: 40m
    alertname: FireRunnerJobsWaitForMemory
    exp_alerts:
    - exp_labels:
        severity: warning
        instance: a
      exp_annotations:
        summary: 90 jobs on a waited over 30 s for host memory in the last 30 min
        description: 'Committed microVM memory is at capacity. Check firerunner_memory_committed_bytes by role: more job VMs than running jobs means leaked VMs (firerunner vm list); a large builder share
          means builder.max or builder.memory_mb is too high; otherwise lower concurrent or pool.size, or add memory.'
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerjobswaitformemory
# DHCP: capacity 0 (the range could not be read) must not page with +Inf%; 200 of 241 must.
- interval: 1m
  input_series:
  - series: firerunner_dhcp_leases{instance="d",job="firerunner",state="live"}
    values: 3x20
  - series: firerunner_dhcp_leases{instance="d",job="firerunner",state="stale"}
    values: 0x20
  - series: firerunner_dhcp_leases_capacity{instance="d",job="firerunner"}
    values: 0x20
  - series: firerunner_dhcp_leases{instance="e",job="firerunner",state="stale"}
    values: 200x20
  - series: firerunner_dhcp_leases_capacity{instance="e",job="firerunner"}
    values: 241x20
  alert_rule_test:
  - eval_time: 15m
    alertname: FireRunnerDHCPLeasesExhausting
    exp_alerts:
    - exp_labels:
        severity: critical
        instance: e
      exp_annotations:
        summary: 82.99% of the microVM DHCP addresses are in use on e
        description: 'At 100% jobs fail with ''got no DHCP lease''. If state="stale" dominates, leases of deleted VMs are not released: check that dhcp_release (dnsmasq-utils) is installed and journalctl
          -u firerunner | grep ''delete failed''.'
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerdhcpleasesexhausting
# Thin pool. t1: 88 % data, but lvs fails for 5 min every 14 min (the series goes
# stale, then is missing): Full must still fire. t2: the daemon is up, the usage is
# gone after 5 min: Unknown fires 15 + 10 min later. t3: the daemon is down: only
# DaemonUnhealthy, not Unknown.
- interval: 1m
  input_series:
  - series: up{instance="t1",job="firerunner"}
    values: 1x50
  - series: firerunner_thinpool_usage_ratio{instance="t1",job="firerunner",type="data"}
    values: 0.88x8 stale _x4 0.88x8 stale _x4 0.88x8 stale _x4 0.88x8
  - series: firerunner_thinpool_usage_ratio{instance="t1",job="firerunner",type="metadata"}
    values: 0.1x8 stale _x4 0.1x8 stale _x4 0.1x8 stale _x4 0.1x8
  - series: up{instance="t2",job="firerunner"}
    values: 1x50
  - series: firerunner_thinpool_usage_ratio{instance="t2",job="firerunner",type="data"}
    values: 0.5x4 stale
  - series: firerunner_thinpool_usage_ratio{instance="t2",job="firerunner",type="metadata"}
    values: 0.1x4 stale
  - series: up{instance="t3",job="firerunner"}
    values: 0x50
  alert_rule_test:
  - eval_time: 5m
    alertname: FireRunnerThinPoolFull
    exp_alerts: []
  - eval_time: 12m
    alertname: FireRunnerThinPoolFull
    exp_alerts:
    - exp_labels:
        severity: warning
        instance: t1
        job: firerunner
        type: data
      exp_annotations:
        summary: Thin pool data 88% full on t1
        description: *thinpool_full_description
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerthinpoolfull
  - eval_time: 40m
    alertname: FireRunnerThinPoolFull
    exp_alerts:
    - exp_labels:
        severity: warning
        instance: t1
        job: firerunner
        type: data
      exp_annotations:
        summary: Thin pool data 88% full on t1
        description: *thinpool_full_description
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerthinpoolfull
  - eval_time: 25m
    alertname: FireRunnerThinPoolUnknown
    exp_alerts: []
  - eval_time: 35m
    alertname: FireRunnerThinPoolUnknown
    exp_alerts:
    - exp_labels:
        severity: warning
        instance: t2
        job: firerunner
      exp_annotations:
        summary: 'Thin pool usage on t2 unknown for 25 min: lvs fails'
        description: 'FireRunnerThinPoolFull cannot fire while the usage is unknown, and at 100% every microVM create fails. On the host: sudo timeout 10 lvs flintlock/thinpool. An error or a hang there
          means LVM or the disk is in trouble (dmesg -T | tail -50); the daemon logs its own lvs error: journalctl -u firerunner | grep ''thin pool usage''.'
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerthinpoolunknown
  - eval_time: 35m
    alertname: FireRunnerDaemonUnhealthy
    exp_alerts:
    - exp_labels:
        severity: critical
        instance: t3
        job: firerunner
      exp_annotations:
        summary: FireRunner daemon on t3 is down or stuck
        description: 'Jobs still run, but every one cold-boots, nothing reconciles and the other FireRunner alerts are blind. Check: journalctl -u firerunner -n 200. Before restarting it, check what
          its loop may wait on, which a restart does not fix: systemctl status flintlockd; sudo timeout 10 lvs flintlock/thinpool. Then: systemctl restart firerunner.'
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerdaemonunhealthy
# Disk: on k the builder cache file system drops to 10 % free (the other has 60 %)
# -> one alert per host after 15 min; k2 has 50 % free -> quiet.
# Registry mirrors' file system: k2's at 12 % free is where the eviction keeps
# it -> neither alert; k3's at 3 % free from 6m (the eviction fails) ->
# FireRunnerRegistryDiskFull after 30 min, not FireRunnerDiskFilling.
- interval: 1m
  input_series:
  - series: firerunner_disk_free_bytes{instance="k2",job="firerunner",dir="/var/lib/firerunner/registries"}
    values: 12x45
  - series: firerunner_disk_size_bytes{instance="k2",job="firerunner",dir="/var/lib/firerunner/registries"}
    values: 100x45
  - series: firerunner_disk_free_bytes{instance="k3",job="firerunner",dir="/var/lib/firerunner/registries"}
    values: 20x5 3x40
  - series: firerunner_disk_size_bytes{instance="k3",job="firerunner",dir="/var/lib/firerunner/registries"}
    values: 100x45
  - series: firerunner_disk_free_bytes{instance="k",job="firerunner",dir="/var/lib/firerunner/builder-cache"}
    values: 20x5 10x30
  - series: firerunner_disk_size_bytes{instance="k",job="firerunner",dir="/var/lib/firerunner/builder-cache"}
    values: 100x35
  - series: firerunner_disk_free_bytes{instance="k",job="firerunner",dir="/var/lib/flintlock/vm"}
    values: 60x35
  - series: firerunner_disk_size_bytes{instance="k",job="firerunner",dir="/var/lib/flintlock/vm"}
    values: 100x35
  - series: firerunner_disk_free_bytes{instance="k2",job="firerunner",dir="/var/lib/firerunner/builder-cache"}
    values: 50x35
  - series: firerunner_disk_size_bytes{instance="k2",job="firerunner",dir="/var/lib/firerunner/builder-cache"}
    values: 100x35
  alert_rule_test:
  - eval_time: 15m
    alertname: FireRunnerDiskFilling
    exp_alerts: []
  - eval_time: 30m
    alertname: FireRunnerDiskFilling
    exp_alerts:
    - exp_labels:
        severity: warning
        instance: k
      exp_annotations:
        summary: Only 10% disk space left for FireRunner data on k
        description: 'Below 10% no builder cache is saved; at 0 cache: uploads and flintlockd''s microVM state can no longer be written. The registry mirrors'' image takes at most FR_REGISTRY_GB of it.
          Check: df -h /var/lib/firerunner /var/lib/flintlock/vm; sudo du -xsh /var/lib/firerunner/* /var/lib/flintlock/vm. cache: archives: re-run the installer with a lower FR_CACHE_DAYS. Saved builder
          caches: lower builder.saved_cache_gb; firerunner builder rm --all deletes every project''s saved cache, so every next build is cold.'
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerdiskfilling
  - eval_time: 30m
    alertname: FireRunnerRegistryDiskFull
    exp_alerts: []
  - eval_time: 40m
    alertname: FireRunnerRegistryDiskFull
    exp_alerts:
    - exp_labels:
        severity: warning
        instance: k3
        job: firerunner
        dir: /var/lib/firerunner/registries
      exp_annotations:
        summary: Only 3% of the registry mirrors' file system is free on k3
        description: 'Its eviction, which keeps at least 10 % and 1.5 GiB free, is failing. A mirror writes a layer it does not hold while it streams it to the job: on a full file system that pull breaks off,
          and the job can fail. Check: journalctl -u firerunner-registry-evict --since -1h; systemctl list-timers ''firerunner-registry-*''; df -h /var/lib/firerunner/registries; sudo du -sh /var/lib/firerunner/registries/*.
          Grow it: re-run the installer with a larger FR_REGISTRY_GB.'
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerregistrydiskfull
# Builders: on h a boot failure and two builders not answering within the hour -> fires;
# its many lru removals are normal and never count. q: 2 events -> quiet.
- interval: 1m
  input_series:
  - series: firerunner_vm_boot_failures_total{instance="h",job="firerunner",kind="builder"}
    values: 0x10 1x50
  - series: firerunner_builder_removals_total{instance="h",job="firerunner",reason="not_answering"}
    values: 0x20 1x10 2x30
  - series: firerunner_builder_removals_total{instance="h",job="firerunner",reason="lru"}
    values: 0+5x60
  - series: firerunner_vm_boot_failures_total{instance="q",job="firerunner",kind="builder"}
    values: 0x10 1x50
  - series: firerunner_builder_removals_total{instance="q",job="firerunner",reason="vm_gone"}
    values: 0x20 1x40
  alert_rule_test:
  - eval_time: 25m
    alertname: FireRunnerBuildersFailing
    exp_alerts: []
  - eval_time: 45m
    alertname: FireRunnerBuildersFailing
    exp_alerts:
    - exp_labels:
        severity: warning
        instance: h
      exp_annotations:
        summary: 3 builders failed to start or died in the last hour on h
        description: 'Those projects'' docker builds run without the layer cache, or fail when their builder dies. See which: journalctl -u firerunner --since -1h | grep -E ''builder boot failed|builder:
          (not answering|VM gone)''. ''no host memory for a builder'': builders do not fit next to the jobs, lower builder.max or builder.memory_mb. Not answering or VM gone: usually the builds of one
          project filled the builder''s memory, lower builder.max_parallelism or raise builder.memory_mb.'
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerbuildersfailing
# A drained host's stopped gitlab-runner is no outage; its other services
# still are, and so is gitlab-runner on a host that is not drained or whose
# daemon is older than firerunner_drained.
- interval: 1m
  input_series:
  - series: firerunner_service_up{instance="d1",job="firerunner",service="gitlab-runner"}
    values: 0x20
  - series: firerunner_service_up{instance="d1",job="firerunner",service="flintlockd"}
    values: 0x20
  - series: firerunner_drained{instance="d1",job="firerunner"}
    values: 1x20
  - series: firerunner_service_up{instance="d2",job="firerunner",service="gitlab-runner"}
    values: 0x20
  - series: firerunner_drained{instance="d2",job="firerunner"}
    values: 0x20
  - series: firerunner_service_up{instance="d3",job="firerunner",service="gitlab-runner"}
    values: 0x20
  alert_rule_test:
  - eval_time: 10m
    alertname: FireRunnerServiceDown
    exp_alerts:
    - exp_labels:
        severity: critical
        instance: d1
        job: firerunner
        service: flintlockd
      exp_annotations:
        summary: flintlockd is down on d1
        description: 'Jobs fail or are not picked up. Check: journalctl -u flintlockd -n 100; firerunner doctor.'
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerservicedown
    - exp_labels:
        severity: critical
        instance: d2
        job: firerunner
        service: gitlab-runner
      exp_annotations:
        summary: gitlab-runner is down on d2
        description: 'Jobs fail or are not picked up. Check: journalctl -u gitlab-runner -n 100; firerunner doctor.'
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerservicedown
    - exp_labels:
        severity: critical
        instance: d3
        job: firerunner
        service: gitlab-runner
      exp_annotations:
        summary: gitlab-runner is down on d3
        description: 'Jobs fail or are not picked up. Check: journalctl -u gitlab-runner -n 100; firerunner doctor.'
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerservicedown
# Proxy credentials refused from 10m on; a job asks every 8, 12 or 30 minutes
# (e8, e12, e30). Each ask after 5 minutes is the forwarder's retry, refused again:
# a 407 from the upstream each time -> critical from the second 407 on, and still at
# 110m. burst: one 407 at 10m (the requests right after it are held back, not
# 407s), then no request: the gauge stays 1 -> quiet. recovered: 407s at 10m and
# 18m -> critical, then a request is accepted at 25m -> quiet. conc: three CONNECTs
# on their way are refused together at 10m (three upstream_auth_failed requests, one
# refusal: the forwarder counts a hold-back once), accepted again at 15m -> quiet.
- interval: 1m
  input_series:
  - series: firerunner_proxy_upstream_auth_failing{instance="e8",job="firerunner"}
    values: 0x9 1x110
  - series: firerunner_proxy_upstream_auth_refusals_total{instance="e8",job="firerunner"}
    values: 0x9 1x7 2x7 3x7 4x7 5x7 6x7 7x7 8x7 9x7 10x7 11x7 12x7 13x7 14x7
  - series: firerunner_proxy_upstream_auth_failing{instance="e12",job="firerunner"}
    values: 0x9 1x110
  - series: firerunner_proxy_upstream_auth_refusals_total{instance="e12",job="firerunner"}
    values: 0x9 1x11 2x11 3x11 4x11 5x11 6x11 7x11 8x11 9x11
  - series: firerunner_proxy_upstream_auth_failing{instance="e30",job="firerunner"}
    values: 0x9 1x110
  - series: firerunner_proxy_upstream_auth_refusals_total{instance="e30",job="firerunner"}
    values: 0x9 1x29 2x29 3x29 4x20
  - series: firerunner_proxy_upstream_auth_failing{instance="burst",job="firerunner"}
    values: 0x9 1x110
  - series: firerunner_proxy_upstream_auth_refusals_total{instance="burst",job="firerunner"}
    values: 0x9 1x110
  - series: firerunner_proxy_requests_total{instance="burst",job="firerunner",kind="tunnel",outcome="upstream_auth_failed"}
    values: 0x9 1+10x3 31x106
  - series: firerunner_proxy_upstream_auth_failing{instance="recovered",job="firerunner"}
    values: 0x9 1x15 0x95
  - series: firerunner_proxy_upstream_auth_refusals_total{instance="recovered",job="firerunner"}
    values: 0x9 1x7 2x102
  - series: firerunner_proxy_upstream_auth_failing{instance="conc",job="firerunner"}
    values: 0x9 1x5 0x105
  - series: firerunner_proxy_upstream_auth_refusals_total{instance="conc",job="firerunner"}
    values: 0x9 1x110
  - series: firerunner_proxy_requests_total{instance="conc",job="firerunner",kind="tunnel",outcome="upstream_auth_failed"}
    values: 0x9 3x110
  alert_rule_test:
  - eval_time: 11m
    alertname: FireRunnerProxyUpstreamAuthFailing
    exp_alerts: []
  - eval_time: 15m
    alertname: FireRunnerProxyUpstreamAuthFailing
    exp_alerts: []
  - eval_time: 20m
    alertname: FireRunnerProxyUpstreamAuthFailing
    exp_alerts:
    - exp_labels: {severity: critical, instance: e8, job: firerunner}
      exp_annotations:
        summary: The corporate proxy refuses the credentials of e8
        description: &auth_failing_description "The corporate proxy refused the credentials again when the forwarder retried them (two 407s in the last hour, at least 5 minutes apart). Every pull, clone and download of jobs, builders, gitlab-runner and the registry mirrors through the proxy fails with 502 (hosts in proxy.no_proxy still work). The password in proxy.upstream_file (/etc/firerunner/proxy-upstream) expired or was changed, or the account is locked. Check: journalctl -u firerunner-proxy | grep 'refused the credentials'. Fix: sudoedit /etc/firerunner/proxy-upstream with the new password, %-encoded; the next request uses it, no restart. The forwarder sends refused credentials again only every 5 minutes, so it does not lock the account."
        runbook_url: &auth_failing_runbook https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerproxyupstreamauthfailing
    - exp_labels: {severity: critical, instance: recovered, job: firerunner}
      exp_annotations:
        summary: The corporate proxy refuses the credentials of recovered
        description: *auth_failing_description
        runbook_url: *auth_failing_runbook
  - eval_time: 30m
    alertname: FireRunnerProxyUpstreamAuthFailing
    exp_alerts:
    - exp_labels: {severity: critical, instance: e8, job: firerunner}
      exp_annotations: &auth_failing_e8
        summary: The corporate proxy refuses the credentials of e8
        description: *auth_failing_description
        runbook_url: *auth_failing_runbook
    - exp_labels: {severity: critical, instance: e12, job: firerunner}
      exp_annotations: &auth_failing_e12
        summary: The corporate proxy refuses the credentials of e12
        description: *auth_failing_description
        runbook_url: *auth_failing_runbook
  - eval_time: 45m
    alertname: FireRunnerProxyUpstreamAuthFailing
    exp_alerts: &auth_failing_all
    - exp_labels: {severity: critical, instance: e8, job: firerunner}
      exp_annotations: *auth_failing_e8
    - exp_labels: {severity: critical, instance: e12, job: firerunner}
      exp_annotations: *auth_failing_e12
    - exp_labels: {severity: critical, instance: e30, job: firerunner}
      exp_annotations:
        summary: The corporate proxy refuses the credentials of e30
        description: *auth_failing_description
        runbook_url: *auth_failing_runbook
  - eval_time: 110m
    alertname: FireRunnerProxyUpstreamAuthFailing
    exp_alerts: *auth_failing_all
# Upstream errors from 10m: p1 100 requests/min answered and 20 failed (17 %) -> warning.
# p2 fails everything but only 5 in 10 minutes -> quiet. p3: the upstream blocks
# half the sites (upstream_refused), none failed -> quiet.
- interval: 1m
  input_series:
  - series: firerunner_proxy_requests_total{instance="p1",job="firerunner",kind="tunnel",outcome="allowed"}
    values: 0+100x40
  - series: firerunner_proxy_requests_total{instance="p1",job="firerunner",kind="tunnel",outcome="upstream_error"}
    values: 0x10 0+20x30
  - series: firerunner_proxy_requests_total{instance="p1",job="firerunner",kind="tunnel",outcome="policy_denied"}
    values: 0+500x40
  - series: firerunner_proxy_requests_total{instance="p2",job="firerunner",kind="request",outcome="upstream_error"}
    values: 0+0.5x40
  - series: firerunner_proxy_requests_total{instance="p3",job="firerunner",kind="tunnel",outcome="allowed"}
    values: 0+50x40
  - series: firerunner_proxy_requests_total{instance="p3",job="firerunner",kind="tunnel",outcome="upstream_refused"}
    values: 0+50x40
  alert_rule_test:
  - eval_time: 12m
    alertname: FireRunnerProxyUpstreamErrors
    exp_alerts: []
  - eval_time: 30m
    alertname: FireRunnerProxyUpstreamErrors
    exp_alerts:
    - exp_labels:
        severity: warning
        instance: p1
      exp_annotations:
        summary: 16.67% of proxied requests on p1 fail at the corporate proxy
        description: "The forwarder answers them 502: the corporate proxy is unreachable, does not answer within 15 s, or the upstream file is unusable. Jobs fail on pulls, clones and downloads, or are slow while retrying. Check: sudo firerunner doctor (upstream reachable, HTTPS through the proxy); journalctl -u firerunner-proxy | grep -E 'upstream proxy (unreachable|did not answer|did not take)|no upstream'. A new proxy address goes in /etc/firerunner/proxy-upstream (no restart)."
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerproxyupstreamerrors
# Proxy metrics unread: m1's forwarder runs, its metrics are not read from 5m ->
# warning after 10 more minutes. m2's forwarder is stopped (FireRunnerProxyDown's) ->
# quiet. m3 is read -> quiet.
- interval: 1m
  input_series:
  - series: firerunner_proxy_metrics_up{instance="m1",job="firerunner"}
    values: 1x4 0x30
  - series: firerunner_service_up{instance="m1",job="firerunner",service="firerunner-proxy"}
    values: 1x35
  - series: firerunner_proxy_metrics_up{instance="m2",job="firerunner"}
    values: 0x35
  - series: firerunner_service_up{instance="m2",job="firerunner",service="firerunner-proxy"}
    values: 0x35
  - series: firerunner_proxy_metrics_up{instance="m3",job="firerunner"}
    values: 1x35
  - series: firerunner_service_up{instance="m3",job="firerunner",service="firerunner-proxy"}
    values: 1x35
  alert_rule_test:
  - eval_time: 13m
    alertname: FireRunnerProxyMetricsMissing
    exp_alerts: []
  - eval_time: 20m
    alertname: FireRunnerProxyMetricsMissing
    exp_alerts:
    - exp_labels:
        severity: warning
        instance: m1
        job: firerunner
      exp_annotations:
        summary: The daemon on m1 cannot read the proxy forwarder's metrics
        description: "FireRunnerProxyUpstreamAuthFailing, FireRunnerProxyUpstreamErrors and FireRunnerProxyAtLimit are blind on this host. Usually firerunner-proxy.service predates its metrics socket (a binary-only firerunner upgrade): it lacks RuntimeDirectory=firerunner-proxy, and journalctl -u firerunner-proxy says 'proxy metrics not exported'. Fix: run the installer again; it restarts the forwarder when no job runs. Check: sudo ls -l /run/firerunner-proxy/metrics.sock; journalctl -u firerunner | grep \"cannot read the forwarder's metrics\"."
        runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerproxymetricsmissing
# Connection limits: p1's busiest microVM holds 230 of 256 (90 %) -> warning per scope.
# p2's host services hold 1000 with no limit (0) and its microVMs 1000 of 4096 -> quiet.
# p3 refused one request at 10m -> warning while it is in the last 10 minutes.
- interval: 1m
  input_series:
  - series: firerunner_proxy_connections{instance="p1",job="firerunner",scope="busiest_microvm"}
    values: 230x40
  - series: firerunner_proxy_connections_limit{instance="p1",job="firerunner",scope="busiest_microvm"}
    values: 256x40
  - series: firerunner_proxy_connections{instance="p1",job="firerunner",scope="microvms"}
    values: 300x40
  - series: firerunner_proxy_connections_limit{instance="p1",job="firerunner",scope="microvms"}
    values: 4096x40
  - series: firerunner_proxy_connections{instance="p2",job="firerunner",scope="host"}
    values: 1000x40
  - series: firerunner_proxy_connections_limit{instance="p2",job="firerunner",scope="host"}
    values: 0x40
  - series: firerunner_proxy_connections{instance="p2",job="firerunner",scope="microvms"}
    values: 1000x40
  - series: firerunner_proxy_connections_limit{instance="p2",job="firerunner",scope="microvms"}
    values: 4096x40
  - series: firerunner_proxy_requests_total{instance="p3",job="firerunner",kind="tunnel",outcome="limit_refused"}
    values: 0x10 1x30
  alert_rule_test:
  - eval_time: 3m
    alertname: FireRunnerProxyAtLimit
    exp_alerts: []
  - eval_time: 17m
    alertname: FireRunnerProxyAtLimit
    exp_alerts:
    - exp_labels:
        severity: warning
        instance: p1
        scope: busiest_microvm
      exp_annotations:
        summary: &at_limit_summary_p1 The proxy forwarder on p1 is near or at a connection limit
        description: &at_limit_description "Past the limit requests get 503 and jobs fail on downloads. busiest_microvm: one job holds most of its 256 connections (parallel downloads, a test opening connections it does not close); microvms: all jobs together near 4096; host: gitlab-runner, containerd and the registry mirrors near 1024. Check: firerunner_proxy_connections by scope; journalctl -u firerunner-proxy | grep 'too many connections' names the client address, firerunner vm list maps it to a job."
        runbook_url: &at_limit_runbook https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerproxyatlimit
    - exp_labels:
        severity: warning
        instance: p3
      exp_annotations:
        summary: The proxy forwarder on p3 is near or at a connection limit
        description: *at_limit_description
        runbook_url: *at_limit_runbook
  # The refusal has left the 10-minute window; p1 still holds 90 %.
  - eval_time: 30m
    alertname: FireRunnerProxyAtLimit
    exp_alerts:
    - exp_labels:
        severity: warning
        instance: p1
        scope: busiest_microvm
      exp_annotations:
        summary: *at_limit_summary_p1
        description: *at_limit_description
        runbook_url: *at_limit_runbook
