# Every alert names what the on-call does next; runbook_url points at the
# alert's row in docs/operations.md (Alerts). The scrape job is assumed to be
# named "firerunner".
groups:
  - name: firerunner
    rules:
      - alert: FireRunnerDaemonUnhealthy
        expr: |
          up{job="firerunner"} == 0
          or (time() - firerunner_loop_last_tick_timestamp_seconds) > 120
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "FireRunner daemon on {{ $labels.instance }} is down or stuck"
          description: "Jobs still run, but every one cold-boots, nothing reconciles and the other FireRunner alerts are blind. Check: journalctl -u firerunner -n 200. Before restarting it, check what its loop may wait on, which a restart does not fix: systemctl status flintlockd; sudo timeout 10 lvs flintlock/thinpool. Then: systemctl restart firerunner."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerdaemonunhealthy
      - alert: FireRunnerFlintlockDown
        expr: firerunner_flintlock_up == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "flintlock API unreachable on {{ $labels.instance }}: no microVM can be created"
          description: "Every new job fails in prepare. Check: systemctl status flintlockd containerd-flintlock; journalctl -u flintlockd -n 100; firerunner doctor."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerflintlockdown
      - alert: FireRunnerServiceDown
        expr: firerunner_service_up{service=~"flintlockd|containerd-flintlock|firerunner-net|firerunner-dnsmasq|gitlab-runner"} == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.service }} is down on {{ $labels.instance }}"
          description: "Jobs fail or are not picked up. Check: journalctl -u {{ $labels.service }} -n 100; firerunner doctor."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerservicedown
      - alert: FireRunnerCacheServiceDown
        expr: firerunner_service_up{service=~"firerunner-registry|firerunner-cache"} == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.service }} is down on {{ $labels.instance }}"
          description: "Jobs run but slower: image pulls bypass the mirror (Docker Hub rate limits) or cache: is not restored. Check: journalctl -u {{ $labels.service }} -n 100; df -h /var/lib/firerunner."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnercacheservicedown
      - alert: FireRunnerSystemFailures
        # Only failures FireRunner or the host caused; failing project scripts never page.
        expr: |
          sum by (instance) (increase(firerunner_jobs_total{result="system_failure",reason!="canceled"}[30m])) >= 3
          and
          sum by (instance) (increase(firerunner_jobs_total{result="system_failure",reason!="canceled"}[30m]))
            / clamp_min(sum by (instance) (increase(firerunner_jobs_total[30m])), 1) > 0.05
        labels: {severity: critical}
        annotations:
          summary: "Jobs on {{ $labels.instance }} fail because of FireRunner or the host"
          description: "Not project bugs. See the reason: sum by (reason) (increase(firerunner_jobs_total{result=\"system_failure\"}[30m])). ssh_lost: host OOM or a VM died; vm_boot: DHCP or boot; flintlock_error: flintlockd or the thin pool; admission_timeout: memory. Per job: journalctl -u firerunner | grep '\"result\":\"system_failure\"'."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnersystemfailures
      - alert: FireRunnerJobsWaitForMemory
        # Jobs that waited over 30 s for host memory in 30 min: at least 3, and
        # over 10 % of the prepared jobs. The histogram only holds jobs that got
        # no ready pool VM at once, so count - bucket{le="30"} are exactly them.
        expr: |
          (
            sum by (instance) (increase(firerunner_job_admission_wait_seconds_count[30m]))
            - sum by (instance) (increase(firerunner_job_admission_wait_seconds_bucket{le="30"}[30m]))
          ) >= 3
          and
          (
            sum by (instance) (increase(firerunner_job_admission_wait_seconds_count[30m]))
            - sum by (instance) (increase(firerunner_job_admission_wait_seconds_bucket{le="30"}[30m]))
          ) / clamp_min(sum by (instance) (increase(firerunner_job_prepare_seconds_count[30m])), 1) > 0.1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} jobs on {{ $labels.instance }} waited over 30 s for host memory in the last 30 min"
          description: "Committed microVM memory is at capacity. Check firerunner_memory_committed_bytes by role: more job VMs than running jobs means leaked VMs (firerunner vm list); a large builder share means builder.max or builder.memory_mb is too high; otherwise lower concurrent or pool.size, or add memory."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerjobswaitformemory
      - alert: FireRunnerHostOOMKill
        expr: increase(firerunner_host_oom_kills_total[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "The kernel OOM-killed a process on {{ $labels.instance }}"
          description: "Usually a firecracker microVM: its job failed with ssh_lost or its builder died (FireRunnerSystemFailures pages when many jobs fail). See what was killed: journalctl -k --since -15min | grep -iE 'out of memory|killed process'. Admission keeps microVM memory below MemTotal minus vm.host_reserve_mb, so the host needed more than that reserve: raise it (firerunner config set vm.host_reserve_mb <MB>), or lower concurrent, pool.size or builder.max."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerhostoomkill
      - alert: FireRunnerThinPoolFull
        # The ratio is absent while lvs fails: max_over_time keeps a filling
        # pool pending across such gaps instead of starting "for" again.
        expr: |
          max_over_time(firerunner_thinpool_usage_ratio{type="data"}[15m]) > 0.85
          or max_over_time(firerunner_thinpool_usage_ratio{type="metadata"}[15m]) > 0.75
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Thin pool {{ $labels.type }} {{ $value | humanizePercentage }} full on {{ $labels.instance }}"
          description: "At 100% every microVM create fails; full metadata can damage the pool. Check: sudo lvs flintlock; firerunner vm list. firerunner builder rm --all frees the builder VMs' disks but also deletes every project's saved layer cache, so every next build is cold. Lasting fix: vgextend flintlock <disk>, then lvextend flintlock/thinpool."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerthinpoolfull
      - alert: FireRunnerThinPoolUnknown
        # Per host: absent_over_time() would stay empty while any other host
        # still reports its thin pool.
        expr: |
          up{job="firerunner"} == 1
          unless on (instance)
          count_over_time(firerunner_thinpool_usage_ratio{type="data"}[15m])
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Thin pool usage on {{ $labels.instance }} unknown for 25 min: lvs fails"
          description: "FireRunnerThinPoolFull cannot fire while the usage is unknown, and at 100% every microVM create fails. On the host: sudo timeout 10 lvs flintlock/thinpool. An error or a hang there means LVM or the disk is in trouble (dmesg -T | tail -50); the daemon logs its own lvs error: journalctl -u firerunner | grep 'thin pool usage'."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerthinpoolunknown
      - alert: FireRunnerDHCPLeasesExhausting
        # Capacity 0 means the DHCP range could not be read, not a full range.
        expr: |
          sum by (instance) (firerunner_dhcp_leases) / sum by (instance) (firerunner_dhcp_leases_capacity) > 0.8
          and sum by (instance) (firerunner_dhcp_leases_capacity) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $value | humanizePercentage }} of the microVM DHCP addresses are in use on {{ $labels.instance }}"
          description: "At 100% jobs fail with 'got no DHCP lease'. If state=\"stale\" dominates, leases of deleted VMs are not released: check that dhcp_release (dnsmasq-utils) is installed and journalctl -u firerunner | grep 'delete failed'."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerdhcpleasesexhausting
      - alert: FireRunnerDiskFilling
        # The fuller of the saved builder caches' and flintlock's microVM state file systems.
        expr: min by (instance) (firerunner_disk_free_bytes / firerunner_disk_size_bytes) < 0.15
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Only {{ $value | humanizePercentage }} disk space left for FireRunner data on {{ $labels.instance }}"
          description: "Below 10% no builder cache is saved; at 0 the registry mirror, cache: uploads and flintlockd's microVM state can no longer be written. Check: df -h /var/lib/firerunner /var/lib/flintlock/vm; sudo du -xsh /var/lib/firerunner/* /var/lib/flintlock/vm. cache: archives: re-run the installer with a lower FR_CACHE_DAYS. Saved builder caches: lower builder.saved_cache_gb; firerunner builder rm --all deletes every project's saved cache, so every next build is cold."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerdiskfilling
      - alert: FireRunnerBuildersFailing
        # Builders that did not start, or died: normal removals (lru, idle,
        # max_age, config_changed, operator, disabled) do not count.
        expr: |
          sum by (instance) (increase(firerunner_vm_boot_failures_total{kind="builder"}[1h]))
          + sum by (instance) (increase(firerunner_builder_removals_total{reason=~"not_answering|vm_gone"}[1h]))
          >= 3
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} builders failed to start or died in the last hour on {{ $labels.instance }}"
          description: "Those projects' docker builds run without the layer cache, or fail when their builder dies. See which: journalctl -u firerunner --since -1h | grep -E 'builder boot failed|builder: (not answering|VM gone)'. 'no host memory for a builder': builders do not fit next to the jobs, lower builder.max or builder.memory_mb. Not answering or VM gone: usually BuildKit ran out of memory in the builder, raise builder.memory_mb or lower builder.max."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerbuildersfailing
