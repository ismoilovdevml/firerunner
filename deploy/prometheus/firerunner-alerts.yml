# Every alert names what the on-call does next; runbook_url points at the
# alert's row in docs/operations.md (Alerts). The scrape job is assumed to be
# named "firerunner".
groups:
  - name: firerunner
    rules:
      - alert: FireRunnerDaemonUnhealthy
        expr: |
          up{job="firerunner"} == 0
          or (time() - firerunner_loop_last_tick_timestamp_seconds) > 120
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "FireRunner daemon on {{ $labels.instance }} is down or stuck"
          description: "Jobs still run, but every one cold-boots, nothing reconciles and the other FireRunner alerts are blind. Check: journalctl -u firerunner -n 200. Before restarting it, check what its loop may wait on, which a restart does not fix: systemctl status flintlockd; sudo timeout 10 lvs flintlock/thinpool. Then: systemctl restart firerunner."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerdaemonunhealthy
      - alert: FireRunnerFlintlockDown
        expr: firerunner_flintlock_up == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "flintlock API unreachable on {{ $labels.instance }}: no microVM can be created"
          description: "Every new job fails in prepare. Check: systemctl status flintlockd containerd-flintlock; journalctl -u flintlockd -n 100; firerunner doctor."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerflintlockdown
      - alert: FireRunnerServiceDown
        # A drained host (firerunner drain) stopped gitlab-runner on purpose.
        expr: |
          firerunner_service_up{service=~"flintlockd|containerd-flintlock|firerunner-net|firerunner-dnsmasq"} == 0
          or (firerunner_service_up{service="gitlab-runner"} == 0 unless on(instance, job) firerunner_drained == 1)
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.service }} is down on {{ $labels.instance }}"
          description: "Jobs fail or are not picked up. Check: journalctl -u {{ $labels.service }} -n 100; firerunner doctor."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerservicedown
      - alert: FireRunnerCacheServiceDown
        # firerunner-registry only starts the mirrors; each mirror is a
        # firerunner-registry@NAME (the registry) and a
        # firerunner-registry-front@NAME (what microVMs pull from).
        expr: firerunner_service_up{service=~"firerunner-cache|firerunner-registry|firerunner-registry(-front)?@.+"} == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.service }} is down on {{ $labels.instance }}"
          description: "{{ if match \"^firerunner-registry\" $labels.service }}Jobs run but slower: image pulls bypass the mirror, to the registry itself (Docker Hub rate limits). Check: journalctl -u {{ $labels.service }} -n 100; systemctl list-units 'firerunner-registry*'; df -h /var/lib/firerunner/registries; systemctl status var-lib-firerunner-registries.mount.{{ else }}Jobs run but slower: they start without their cache:. Check: journalctl -u {{ $labels.service }} -n 100; df -h /var/lib/firerunner/cache.{{ end }}"
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnercacheservicedown
      - alert: FireRunnerProxyDown
        # Only hosts with proxy.enabled report the forwarder; elsewhere the series is absent.
        expr: firerunner_service_up{service="firerunner-proxy"} == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "firerunner-proxy is down on {{ $labels.instance }}: nothing reaches the corporate proxy"
          description: "microVMs, builders, gitlab-runner, containerd-flintlock and the registry mirrors reach the outside through it: jobs fail on pulls, clones and downloads (hosts in proxy.no_proxy still work). Check: journalctl -u firerunner-proxy -n 100; firerunner doctor (a 407 means the upstream refused the credentials). Fix: systemctl start firerunner-proxy."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerproxydown
      - alert: FireRunnerProxyUpstreamAuthFailing
        # 1 from a 407 until the upstream accepts the credentials again. The
        # forwarder retries refused credentials once after 5 minutes (when a
        # request comes): a one-off refusal clears well within the 10 minutes.
        expr: firerunner_proxy_upstream_auth_failing == 1
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "The corporate proxy refuses the credentials of {{ $labels.instance }}"
          description: "Every pull, clone and download of jobs, builders, gitlab-runner and the registry mirrors through the proxy fails with 502 (hosts in proxy.no_proxy still work). The password in proxy.upstream_file (/etc/firerunner/proxy-upstream) expired or was changed, or the account is locked. Check: journalctl -u firerunner-proxy | grep 'refused the credentials'. Fix: sudoedit /etc/firerunner/proxy-upstream with the new password, %-encoded; the next request uses it, no restart. The forwarder sends refused credentials again only every 5 minutes, so it does not lock the account."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerproxyupstreamauthfailing
      - alert: FireRunnerProxyUpstreamErrors
        # Requests that went for the upstream: opened or answered (allowed) or
        # failed there. Destinations the upstream itself blocks
        # (upstream_refused) are not errors; a 407 has its own alert.
        # Over 10 %, and at least 10 such requests in 10 minutes.
        expr: |
          sum by (instance) (increase(firerunner_proxy_requests_total{outcome="upstream_error"}[10m]))
            / clamp_min(sum by (instance) (increase(firerunner_proxy_requests_total{outcome=~"allowed|upstream_.*"}[10m])), 1) > 0.1
          and
          sum by (instance) (increase(firerunner_proxy_requests_total{outcome="upstream_error"}[10m])) >= 10
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | humanizePercentage }} of proxied requests on {{ $labels.instance }} fail at the corporate proxy"
          description: "The forwarder answers them 502: the corporate proxy is unreachable, does not answer within 15 s, or the upstream file is unusable. Jobs fail on pulls, clones and downloads, or are slow while retrying. Check: sudo firerunner doctor (upstream reachable, HTTPS through the proxy); journalctl -u firerunner-proxy | grep -E 'upstream proxy (unreachable|did not answer|did not take)|no upstream'. A new proxy address goes in /etc/firerunner/proxy-upstream (no restart)."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerproxyupstreamerrors
      - alert: FireRunnerProxyAtLimit
        # The busiest microVM, all microVMs or the host services over 80 % of
        # their connection limit, or requests refused for it (503), which a
        # short burst causes between two scrapes.
        expr: |
          max by (instance, scope) (firerunner_proxy_connections / (firerunner_proxy_connections_limit > 0)) > 0.8
          or
          sum by (instance) (increase(firerunner_proxy_requests_total{outcome="limit_refused"}[10m])) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "The proxy forwarder on {{ $labels.instance }} is near or at a connection limit"
          description: "Past the limit requests get 503 and jobs fail on downloads. busiest_microvm: one job holds most of its 256 connections (parallel downloads, a test opening connections it does not close); microvms: all jobs together near 4096; host: gitlab-runner, containerd and the registry mirrors near 1024. Check: firerunner_proxy_connections by scope; journalctl -u firerunner-proxy | grep 'too many connections' names the client address, firerunner vm list maps it to a job."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerproxyatlimit
      - alert: FireRunnerSystemFailures
        # Only failures FireRunner or the host caused; failing project scripts never page.
        expr: |
          sum by (instance) (increase(firerunner_jobs_total{result="system_failure",reason!="canceled"}[30m])) >= 3
          and
          sum by (instance) (increase(firerunner_jobs_total{result="system_failure",reason!="canceled"}[30m]))
            / clamp_min(sum by (instance) (increase(firerunner_jobs_total[30m])), 1) > 0.05
        labels: {severity: critical}
        annotations:
          summary: "Jobs on {{ $labels.instance }} fail because of FireRunner or the host"
          description: "Not project bugs. See the reason: sum by (reason) (increase(firerunner_jobs_total{result=\"system_failure\"}[30m])). ssh_lost: host OOM or a VM died; vm_boot: DHCP or boot; flintlock_error: flintlockd or the thin pool; admission_timeout: memory. Per job: journalctl -u firerunner | grep '\"result\":\"system_failure\"'."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnersystemfailures
      - alert: FireRunnerJobsWaitForMemory
        # Jobs that waited over 30 s for host memory in 30 min: at least 3, and
        # over 10 % of the prepared jobs. The histogram only holds jobs that got
        # no ready pool VM at once, so count - bucket{le="30"} are exactly them.
        expr: |
          (
            sum by (instance) (increase(firerunner_job_admission_wait_seconds_count[30m]))
            - sum by (instance) (increase(firerunner_job_admission_wait_seconds_bucket{le="30"}[30m]))
          ) >= 3
          and
          (
            sum by (instance) (increase(firerunner_job_admission_wait_seconds_count[30m]))
            - sum by (instance) (increase(firerunner_job_admission_wait_seconds_bucket{le="30"}[30m]))
          ) / clamp_min(sum by (instance) (increase(firerunner_job_prepare_seconds_count[30m])), 1) > 0.1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} jobs on {{ $labels.instance }} waited over 30 s for host memory in the last 30 min"
          description: "Committed microVM memory is at capacity. Check firerunner_memory_committed_bytes by role: more job VMs than running jobs means leaked VMs (firerunner vm list); a large builder share means builder.max or builder.memory_mb is too high; otherwise lower concurrent or pool.size, or add memory."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerjobswaitformemory
      - alert: FireRunnerHostOOMKill
        expr: increase(firerunner_host_oom_kills_total[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "The kernel OOM-killed a process on {{ $labels.instance }}"
          description: "Usually a firecracker microVM: its job failed with ssh_lost or its builder died (FireRunnerSystemFailures pages when many jobs fail). See what was killed: journalctl -k --since -15min | grep -iE 'out of memory|killed process'. Admission keeps microVM memory below MemTotal minus vm.host_reserve_mb, so the host needed more than that reserve: raise it (firerunner config set vm.host_reserve_mb <MB>), or lower concurrent, pool.size or builder.max."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerhostoomkill
      - alert: FireRunnerThinPoolFull
        # The ratio is absent while lvs fails: max_over_time keeps a filling
        # pool pending across such gaps instead of starting "for" again.
        expr: |
          max_over_time(firerunner_thinpool_usage_ratio{type="data"}[15m]) > 0.85
          or max_over_time(firerunner_thinpool_usage_ratio{type="metadata"}[15m]) > 0.75
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Thin pool {{ $labels.type }} {{ $value | humanizePercentage }} full on {{ $labels.instance }}"
          description: "At 100% every microVM create fails; full metadata can damage the pool. Check: sudo lvs flintlock; firerunner vm list. firerunner builder rm --all frees the builder VMs' disks but also deletes every project's saved layer cache, so every next build is cold. Lasting fix: vgextend flintlock <disk>, then lvextend flintlock/thinpool."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerthinpoolfull
      - alert: FireRunnerThinPoolUnknown
        # Per host: absent_over_time() would stay empty while any other host
        # still reports its thin pool.
        expr: |
          up{job="firerunner"} == 1
          unless on (instance)
          count_over_time(firerunner_thinpool_usage_ratio{type="data"}[15m])
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Thin pool usage on {{ $labels.instance }} unknown for 25 min: lvs fails"
          description: "FireRunnerThinPoolFull cannot fire while the usage is unknown, and at 100% every microVM create fails. On the host: sudo timeout 10 lvs flintlock/thinpool. An error or a hang there means LVM or the disk is in trouble (dmesg -T | tail -50); the daemon logs its own lvs error: journalctl -u firerunner | grep 'thin pool usage'."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerthinpoolunknown
      - alert: FireRunnerDHCPLeasesExhausting
        # Capacity 0 means the DHCP range could not be read, not a full range.
        expr: |
          sum by (instance) (firerunner_dhcp_leases) / sum by (instance) (firerunner_dhcp_leases_capacity) > 0.8
          and sum by (instance) (firerunner_dhcp_leases_capacity) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $value | humanizePercentage }} of the microVM DHCP addresses are in use on {{ $labels.instance }}"
          description: "At 100% jobs fail with 'got no DHCP lease'. If state=\"stale\" dominates, leases of deleted VMs are not released: check that dhcp_release (dnsmasq-utils) is installed and journalctl -u firerunner | grep 'delete failed'."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerdhcpleasesexhausting
      - alert: FireRunnerDiskFilling
        # The fuller of the saved builder caches' and flintlock's microVM state
        # file systems. Not the registry mirrors': their eviction keeps only
        # 10 to 20 % of it free on purpose (FireRunnerRegistryDiskFull).
        expr: |
          min by (instance) (
            firerunner_disk_free_bytes{dir!="/var/lib/firerunner/registries"}
              / firerunner_disk_size_bytes{dir!="/var/lib/firerunner/registries"}
          ) < 0.15
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Only {{ $value | humanizePercentage }} disk space left for FireRunner data on {{ $labels.instance }}"
          description: "Below 10% no builder cache is saved; at 0 cache: uploads and flintlockd's microVM state can no longer be written. The registry mirrors' image takes at most FR_REGISTRY_GB of it. Check: df -h /var/lib/firerunner /var/lib/flintlock/vm; sudo du -xsh /var/lib/firerunner/* /var/lib/flintlock/vm. cache: archives: re-run the installer with a lower FR_CACHE_DAYS. Saved builder caches: lower builder.saved_cache_gb; firerunner builder rm --all deletes every project's saved cache, so every next build is cold."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerdiskfilling
      - alert: FireRunnerRegistryDiskFull
        # The eviction (every 2 min) starts below 10 % or 1.5 GiB free and
        # frees up to 20 % and 3 GiB: under 5 % free for 30 min means it
        # fails. Free is what the mirrors may still write (it leaves out the
        # blocks ext4 keeps for root on a disk of your own; the installer's
        # image keeps none), as the eviction counts it.
        expr: |
          firerunner_disk_free_bytes{dir="/var/lib/firerunner/registries"}
            / firerunner_disk_size_bytes{dir="/var/lib/firerunner/registries"} < 0.05
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Only {{ $value | humanizePercentage }} of the registry mirrors' file system is free on {{ $labels.instance }}"
          description: "Its eviction, which keeps at least 10 % and 1.5 GiB free, is failing. A mirror writes a layer it does not hold while it streams it to the job: on a full file system that pull breaks off, and the job can fail. Check: journalctl -u firerunner-registry-evict --since -1h; systemctl list-timers 'firerunner-registry-*'; df -h /var/lib/firerunner/registries; sudo du -sh /var/lib/firerunner/registries/*. Grow it: re-run the installer with a larger FR_REGISTRY_GB."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerregistrydiskfull
      - alert: FireRunnerBuildersFailing
        # Builders that did not start, or died: normal removals (lru, idle,
        # max_age, config_changed, operator, disabled) do not count.
        expr: |
          sum by (instance) (increase(firerunner_vm_boot_failures_total{kind="builder"}[1h]))
          + sum by (instance) (increase(firerunner_builder_removals_total{reason=~"not_answering|vm_gone"}[1h]))
          >= 3
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} builders failed to start or died in the last hour on {{ $labels.instance }}"
          description: "Those projects' docker builds run without the layer cache, or fail when their builder dies. See which: journalctl -u firerunner --since -1h | grep -E 'builder boot failed|builder: (not answering|VM gone)'. 'no host memory for a builder': builders do not fit next to the jobs, lower builder.max or builder.memory_mb. Not answering or VM gone: usually the builds of one project filled the builder's memory, lower builder.max_parallelism or raise builder.memory_mb."
          runbook_url: https://github.com/ismoilovdevml/firerunner/blob/main/docs/operations.md#firerunnerbuildersfailing
