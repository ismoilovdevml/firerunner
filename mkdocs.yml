site_name: FireRunner
site_description: Run every GitLab CI job in its own Firecracker microVM, on your own hardware.
site_url: https://ismoilovdevml.github.io/firerunner/
repo_url: https://github.com/ismoilovdevml/firerunner
repo_name: ismoilovdevml/firerunner
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - md_in_html
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Install: install.md
  - Writing jobs: jobs.md
  - Configuration: configuration.md
  - Operations: operations.md
  - How it works: how-it-works.md
  - Reference: reference.md
