name: Images

on:
  push:
    branches: [ main ]
    paths: [ 'images/**', '.github/workflows/images.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  rootfs:
    name: rootfs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/rootfs
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/firerunner-rootfs:latest
            ghcr.io/${{ github.repository_owner }}/firerunner-rootfs:${{ github.sha }}
