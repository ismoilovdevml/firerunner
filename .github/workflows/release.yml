name: Release

# Tags (v*) publish a versioned release; every push to main refreshes the
# rolling "edge" pre-release that install.sh uses by default.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    # Changes that do not reach the binary do not republish edge.
    paths-ignore: [ 'images/**', '**.md', 'docs/**', 'mkdocs.yml', 'deploy/**', 'test/**',
                    'Makefile', '.golangci.yml', '.gitignore', 'LICENSE',
                    '.github/dependabot.yml',
                    '.github/workflows/ci.yml', '.github/workflows/docs.yml',
                    '.github/workflows/images.yml', '.github/workflows/kernel.yml' ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # Sigstore signing of the build provenance
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then VERSION=${GITHUB_REF_NAME}; else VERSION=edge-${GITHUB_SHA::7}; fi
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o dist/firerunner-linux-amd64 ./cmd/firerunner
          cp install.sh dist/

      - name: SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/firerunner.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        run: |
          (cd dist && sha256sum firerunner-linux-* install.sh firerunner.spdx.json > checksums.txt)
          cat dist/checksums.txt

      # An Ed25519 signature over checksums.txt: a release asset replaced on
      # GitHub (with matching checksums) fails the check in `firerunner
      # upgrade` and install.sh, which carry the public key
      # (internal/upgrade/release-signing.pub).
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          key="$RUNNER_TEMP/release-signing.key"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/checksums.txt -out dist/checksums.txt.sig
          rm -f "$key"
          openssl pkeyutl -verify -pubin -inkey internal/upgrade/release-signing.pub -rawin \
            -in dist/checksums.txt -sigfile dist/checksums.txt.sig

      # Signed build provenance: verify with
      #   gh attestation verify firerunner-linux-amd64 --repo ismoilovdevml/firerunner
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/firerunner-linux-amd64
            dist/install.sh

      - name: Publish edge
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        # Update in place so installs never hit a missing release; checksums go last.
        run: |
          git tag -f edge "$GITHUB_SHA"
          git push -f origin refs/tags/edge
          notes="Rolling build of main. Install: curl -sfL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sudo bash"
          if gh release view edge >/dev/null 2>&1; then
            gh release edit edge --prerelease --title "edge (main @ ${GITHUB_SHA::7})" --notes "$notes"
            gh release upload edge dist/firerunner-linux-amd64 dist/install.sh dist/firerunner.spdx.json --clobber
            gh release upload edge dist/checksums.txt dist/checksums.txt.sig --clobber
          else
            gh release create edge dist/* --prerelease --title "edge (main @ ${GITHUB_SHA::7})" --notes "$notes"
          fi

      - name: Publish version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
