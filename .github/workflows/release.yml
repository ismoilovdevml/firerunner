name: Release

# Tags (v*) publish a versioned release; every push to main refreshes the
# rolling "edge" pre-release that install.sh uses by default.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore: [ 'images/**', '**.md' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then VERSION=${GITHUB_REF_NAME}; else VERSION=edge-${GITHUB_SHA::7}; fi
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o dist/firerunner-linux-amd64 ./cmd/firerunner
          cp install.sh dist/
          (cd dist && sha256sum firerunner-linux-* install.sh > checksums.txt)
          cat dist/checksums.txt

      - name: Publish edge
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        # Update in place so installs never hit a missing release; checksums go last.
        run: |
          git tag -f edge "$GITHUB_SHA"
          git push -f origin refs/tags/edge
          notes="Rolling build of main. Install: curl -sfL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sudo bash"
          if gh release view edge >/dev/null 2>&1; then
            gh release edit edge --prerelease --title "edge (main @ ${GITHUB_SHA::7})" --notes "$notes"
            gh release upload edge dist/firerunner-linux-amd64 dist/install.sh --clobber
            gh release upload edge dist/checksums.txt --clobber
          else
            gh release create edge dist/* --prerelease --title "edge (main @ ${GITHUB_SHA::7})" --notes "$notes"
          fi

      - name: Publish version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
