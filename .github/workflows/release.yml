name: Release

# Tags (v*) publish a versioned release; every push to main refreshes the
# rolling "edge" pre-release that install.sh uses by default.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore: [ 'images/**', '**.md' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then VERSION=${GITHUB_REF_NAME}; else VERSION=edge-${GITHUB_SHA::7}; fi
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o dist/firerunner-linux-amd64 ./cmd/firerunner
          cp install.sh dist/
          (cd dist && sha256sum firerunner-linux-* install.sh > checksums.txt)
          cat dist/checksums.txt

      - name: Publish edge
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete edge --yes --cleanup-tag 2>/dev/null || true
          gh release create edge dist/* --prerelease --target "$GITHUB_SHA" \
            --title "edge (main @ ${GITHUB_SHA::7})" \
            --notes "Rolling build of main. Install: curl -sfL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sudo bash"

      - name: Publish version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
