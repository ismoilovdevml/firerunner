name: Kernel

on:
  push:
    branches: [ main ]
    paths: [ 'images/kernel/**', '.github/workflows/kernel.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  kernel:
    name: guest kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Kernel version
        id: version
        run: echo "version=$(sed -n 's/^ARG KERNEL_VERSION=//p' images/kernel/Dockerfile)" >>"$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/kernel
          platforms: linux/amd64
          push: true
          provenance: false
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/firerunner-kernel:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/firerunner-kernel:${{ github.sha }}
