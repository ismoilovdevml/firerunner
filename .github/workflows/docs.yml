name: Docs

on:
  push:
    branches: [ main ]
    paths: [ 'docs/**', 'mkdocs.yml', '.github/workflows/docs.yml' ]
  # Pull requests only build the site (strict), so a broken link fails before
  # the merge; only main publishes it.
  pull_request:
    branches: [ main ]
    paths: [ 'docs/**', 'mkdocs.yml', '.github/workflows/docs.yml' ]
  workflow_dispatch:

# Pull request builds get read-only scopes; only the deploy job can publish.
permissions:
  contents: read

# Keyed per ref: a pull request's build never cancels a deployment of main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the site settings
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Build site
        run: |
          pip install mkdocs==1.6.1 mkdocs-material==9.7.7
          mkdocs build --strict -d site

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
